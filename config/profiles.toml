# Song profiles: how a book sounds.
#
# A profile is one style line (what Suno's "Style of Music" box gets) and two Suno personas,
# one with a female and one with a male lead singer. Which profile and which lead a book uses
# is chosen in books.toml, so every chapter of a book gets the same style and the same singer.
#
# Personas: in Suno, save a persona from a song you like, then type its name here.
# Leave it as "" until you have one; each lyric sheet says which persona to pick.
#
# To add a profile, copy one of the [profiles.xxx] blocks below and give it a new name.


# Voice tags: what is written into the lyrics where a new voice starts singing.
# Tags describe a kind of voice, never a person (Suno does not know who Naomi is).
# A profile can change any of them in its own [profiles.xxx.tags] block.
# How a mood tag inside a chapter is written (mood-list.toml gives the words).
family_tag = "[Mood: {words}]"


[tags]
narrator     = "[Lead Vocal]"        # back to the narrator (the persona)
female       = "[Female Vocal]"      # a woman speaking
male         = "[Male Vocal]"        # a man speaking
group        = "[Choir]"             # a crowd or several people
female_group = "[Female Choir]"      # a group of women
divine       = "[Deep Male Vocal]"   # God speaking
refrain      = "[Choir]"             # a line the chapter repeats (Psalm 136)


# Chapter kinds that are not moods (see moods.toml): words added to the book's style line for a
# chapter of that kind. The kinds that are moods (lament, praise, trust …) take their words from
# mood-list.toml [kinds]. A kind named here wins over mood-list.toml; "" = no own style for that
# kind. A profile can set any kind in its own [profiles.xxx.moods] block.
[moods]
prayer       = "slower, intimate, prayerful"
wisdom       = "thoughtful, measured"
royal        = "stately, majestic"

# Instruments a psalm heading names; added to the style line of that psalm.
[instruments]
strings = "with harp and strings"
flutes  = "with flutes"


[profiles.folk]
style = "acoustic folk ballad, 90 BPM, fingerpicked guitar, soft strings, storytelling, earnest"
persona.female = ""
persona.male = ""

[profiles.country]
style = "country, 92 BPM, acoustic guitar, pedal steel, fiddle, warm, heartfelt"
persona.female = ""
persona.male = ""

[profiles.jazz]
style = "smooth jazz ballad, 76 BPM, piano trio, upright bass, brushed drums, intimate"
persona.female = ""
persona.male = ""

[profiles.lullaby]
style = "gentle lullaby, 66 BPM, music box, soft strings, hushed, tender"
persona.female = ""
persona.male = ""

[profiles.lullaby.tags]
group = "[Soft Choir]"
female_group = "[Soft Female Choir]"
divine = "[Soft Male Vocal]"
refrain = "[Soft Choir]"

[profiles.pop]
style = "modern pop, 104 BPM, synths, punchy drums, bright, uplifting"
