# How the lyrics are laid out: text, setting, lines, stanzas, sections, chorus, psalm marks, length.
# These are the defaults for every book and edition. (How a book SOUNDS is in books.toml /
# profiles.toml.) A language can change any of them in languages.toml ([eng.layout.lines] ...),
# and an edition in editions.toml ([BSB.layout.lines] ...). A command-line option
# (e.g. --max-lines) wins over all of them for that run.


[text]
# How length is counted in the edition's text (for lines.min_words):
#   "words"       runs of letters between spaces and punctuation
#   "characters"  letters one by one, for scripts written without spaces (Chinese, Japanese, Thai)
count = "words"

# Which punctuation at a line break goes to the next line:
#   "spacing"  read from the spaces of the text, the same for every language: marks touching the
#              next word are its own (”Vi, «Nous, ¿Qué, (Jesus); if they touch the word before too
#              (scripts without spaces), only those after the last clause end. An opening mark
#              standing alone between spaces (Unicode Ps, Pi: the French « of ": « Nous") goes too;
#              a closing one (the » of "Nous » dit-il") or a dash stays.
#   "list"     only the marks of line_start_punctuation, just before the word
line_start = "spacing"

# For "spacing": the marks that end a clause or sentence, which a line never takes from the line before.
clause_end_punctuation = ".,;:!?…。，、；：！？"

# The clause ends of clause_end_punctuation that are only a pause (commas). Where a clause line
# starts inside a run of unlinked words (lines.pull_unaligned), it starts after the strongest mark
# in the run: a mark the next word takes (”Amen, «Nous), else a clause end other than these, else a
# comma or another mark.
comma_punctuation = ",，、"

# For "list": the marks that belong to the start of the next line (opening quotes and brackets,
# Spanish ¿ ¡, dashes).
line_start_punctuation = "“‘\"'([{«‹¿¡—–-"


[setting]
# Whether a chapter is sung as a song, as poetry, or told as a story (prose), from the
# passage-facts form codes on its verses.
# A chapter is "song" when at least `share` of its verses are song, "poetry" when song and
# poetic lines together reach it, else "prose".
share = 0.5
song_forms = ["fm.ms.song"]                       # the Masoretic song layout
song_quotes = ["qt.song", "qt.song_speech"]       # a song in a speech
# Poetic lines: the Masoretic layout, Nestle 1904's printed lines, and how two translations
# (ULT, BSB) indent the text. An edition can drop "fm.tr.poetry" if it should not lean on them.
poetic_forms = ["fm.ms.lines", "fm.ed.lines", "fm.ed.qlines", "fm.ed.block", "fm.tr.poetry"]


[lines]
# A line shorter than this many words is joined to its neighbour (same verse and voice).
min_words = 3

# Line breaks inside poetic verses of Psalms, Proverbs and Job:
#   "clauses"         a new line at each clause of the Hebrew (as everywhere else)
#   "halves"          only where the verse divides in two (its main accent: half A / half B)
#   "clauses+halves"  both
poetry = "clauses+halves"

# A compact alignment links only the edition's content words, so a clause's first word may be a
# word with no link ("when the" in "when the judges ruled"). Where the line would start at the first
# linked word, it starts this many unlinked words earlier, up to punctuation or the line before:
#   "compact"  for compact alignments only (a full alignment links function words too)
#   "always"   for every alignment
#   "never"    lines start at the first linked word
pull_unaligned = "compact"


[stanzas]
# A stanza longer than this many lines is split at verse starts: into as few stanzas as fit,
# at the verses where the Hebrew/Greek most clearly starts something new (a new episode,
# "and now", a setting, a new participant, the narrator taking over), as even as possible.
max_lines = 12

# A split never leaves a stanza shorter than this many lines.
min_lines = 2

# The edition's own layout. These depend on the edition, so they are off by default; an edition
# can switch them on in editions.toml.
#   edition_paragraphs:        "never", "nt" (in the New Testament, whose Greek has no paragraph
#                              marks) or "always": start a stanza at each of the edition's paragraphs
#   edition_heading_weight:    extra weight for a split at a verse where the edition has a heading
#   edition_paragraph_weight:  extra weight for a split at the edition's paragraph start
edition_paragraphs = "never"
edition_heading_weight = 0
edition_paragraph_weight = 0

# Acrostics (Psalm 119, Lamentations ...): a new stanza starts at each new letter of the alphabet
# when the letter covers at least this many verses or lines (Psalm 119: 8 verses per letter).
# Acrostics with a new letter on every verse are only noted in the notes file.
acrostic_min_run = 2


[sections]
# Which section tags are written into the lyrics:
#   "all"            [Verse 1], [Chorus], [Bridge]
#   "chorus_bridge"  only [Chorus] and [Bridge]; other stanzas are just separated by a blank line
#   "none"           no section tags at all (voice tags stay)
tags = "all"

# Number the verse sections ([Verse 1], [Verse 2] ...) or not ([Verse]).
number_verses = true


[chorus]
# Where a [Chorus] comes from:
#   "text"   a line the Hebrew/Greek text itself repeats in the chapter (passage-facts
#            fm.tx.refrain); the same in every edition and language
#   "lines"  a line of the edition that is repeated word for word (depends on the language)
#   "both"
source = "text"

# How a chorus is set out:
#   "section"  each time the refrain comes, it is its own [Chorus] section (Suno sings it as the hook);
#              where it comes back inside one stanza (Psalm 136) the stanza stays whole, call and response
#   "inline"   the stanza always stays whole; the refrain is sung by the [Choir] (refrain tag) inside it
style = "section"

# A repeated line in the Hebrew/Greek needs at least this many words to become a chorus.
min_words = 3

# true: a repeated line that only introduces speech is no chorus: each time it comes, a quote of
# passage-facts starts with the next word ("and he said to him", καὶ λέγει αὐτῷ, John 1:41, 45, 51).
skip_speech_frames = true

# For source "lines" / "both": how often an edition line must repeat, and its least length in words.
lines_min_repeats = 3
lines_min_words = 3


[speakers]
# Books whose chapters are pieces of their own (the Psalms: 150 poems). There a speaker the chapter
# does not name takes no words from another chapter where they are only described there ("enemies",
# "men"): the source gives one speaker id to the enemies of many psalms. A speaker with a name
# (David, the LORD) is still named from another chapter, and gets a pointer to it.
separate_chapters = ["PSA"]

# Marks between two words at which a speaker's name, as read from the text, ends: the words of the
# name then end at the last word aligned to it before the mark. Where an edition renders the naming
# words around a speech ("All answered: — Yes, we are"), the label is "All", not the whole clause.
label_stops = [":", ";", "—", "–", "«", "“", "\""]


[psalms]
# List the psalm heading's terms (for the leader, the instruments, the tune ...) and the selahs
# in the notes file. They are never sung.
heading_terms = true

# A tag put on its own line after a line holding "Selah", e.g. "[Instrumental Break]".
# "" = none (the word Selah is the edition's text and is sung as it stands).
selah_tag = ""


[length]
# Warn in the notes file when the lyrics are longer than this many characters.
max_chars = 5000

# scripts/cut_points.py: cut long chapters into parts under this many characters.
cut_limit = 4000
